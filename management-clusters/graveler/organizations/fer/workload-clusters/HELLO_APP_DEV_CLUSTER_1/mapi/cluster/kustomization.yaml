apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
# the release this cluster runs, and the cluster-aws version that release ships
configMapGenerator:
  - behavior: replace
    files:
      - values=cluster_user_config.yaml
    name: ${cluster_name}-user-config
    namespace: org-${organization}
generatorOptions:
  disableNameSuffixHash: true
kind: Kustomization
patches:
  - patch: |-
      - op: replace
        path: /spec/version
        value: "11.0.1"
    target:
      kind: App
      name: \${cluster_name}
resources:
  - ../../../../../../../../bases/environments/stages/dev/hello_app_cluster
