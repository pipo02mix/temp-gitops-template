apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: graveler-clusters-fer-test
  namespace: default
spec:
  interval: 1m
  path: ./management-clusters/graveler/organizations/fer/workload-clusters/fer-test/mapi
  postBuild:
    substitute:
      cluster_description: "fer-test managed by GitOps"
      cluster_name: "fer-test"
      organization: "fer"
  prune: false
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: temp-gitops-template
  timeout: 2m
