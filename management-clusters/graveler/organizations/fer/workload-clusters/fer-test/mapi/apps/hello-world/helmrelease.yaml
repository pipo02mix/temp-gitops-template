---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: fer-test
  name: fer-test-hello-world
  namespace: org-fer
spec:
  chartRef:
    kind: OCIRepository
    name: fer-test-hello-world
  install:
    createNamespace: true
  interval: 10m0s
  kubeConfig:
    secretRef:
      name: fer-test-kubeconfig
  releaseName: hello-world
  storageNamespace: hello-world
  targetNamespace: hello-world
  valuesFrom:
    - kind: ConfigMap
      name: fer-test-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: fer-test-hello-world-values
      valuesKey: values
    - kind: Secret
      name: fer-test-hello-world-user-secrets
      optional: true
      valuesKey: values
