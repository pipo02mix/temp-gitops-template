apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: org-${organization}
configMapGenerator:
  - name: ${cluster_name}-hello-world-values
    files:
      - values=values.yaml
generatorOptions:
  disableNameSuffixHash: true
resources:
  - helmrelease.yaml
  - ocirepository.yaml
