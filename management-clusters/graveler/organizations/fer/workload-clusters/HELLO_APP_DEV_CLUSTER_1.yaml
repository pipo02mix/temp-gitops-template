apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clusters-hello-app-dev-1
  namespace: default
spec:
  interval: 1m
  path: "./management-clusters/graveler/organizations/fer/workload-clusters/HELLO_APP_DEV_CLUSTER_1/mapi"
  postBuild:
    substitute:
      cluster_description: "description"
      cluster_domain: "MY_DOMAIN"
      cluster_name: "hello-app-dev-1"  # must be a valid Kubernetes name
      cluster_release: "0.8.1"
      default_apps_release: "0.2.0"
      organization: "fer"
  prune: false
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: temp-gitops-template
  timeout: 2m
