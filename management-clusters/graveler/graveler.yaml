apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: graveler-gitops
  namespace: default
spec:
  interval: 1m
  path: ./management-clusters/graveler
  prune: false
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: temp-gitops-template
  timeout: 2m
