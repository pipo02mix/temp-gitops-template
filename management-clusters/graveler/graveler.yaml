apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: graveler-gitops
  namespace: default
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg-master
  serviceAccountName: automation
  prune: false
  interval: 1m
  path: "./management-clusters/graveler"
  sourceRef:
    kind: GitRepository
    name: temp-gitops-template
  timeout: 2m
