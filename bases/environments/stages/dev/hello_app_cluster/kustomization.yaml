apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
kind: Kustomization
patches:
  - patch: |-
      - op: replace
        path: /spec/ref
        value:
          semver: '>=3.0.0-0'
          semverFilter: '-r[0-9a-f]{8}t[0-9]{14}h[0-9a-f]{7}'
    target:
      kind: OCIRepository
      name: \${cluster_name}-hello-world
resources:
  - ../../../../cluster_templates/hello_app_cluster
